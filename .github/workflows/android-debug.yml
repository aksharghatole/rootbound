name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 -o "$RUNNER_TEMP/templates.tpz" https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/export-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp "$RUNNER_TEMP/export-templates/templates/android_debug.apk" "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Android SDK and debug signing
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 -o "$RUNNER_TEMP/android-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes receives SIGPIPE after licenses are accepted; check sdkmanager itself.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/rootbound-ci.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Rootbound CI Debug" -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/rootbound-ci.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "GODOT_SILENCE_ROOT_WARNING=1" >> "$GITHUB_ENV"
      - name: Run regression suite
        run: bash scripts/check.sh
      - name: Export debug APK
        run: bash scripts/build_android.sh
      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/rootbound.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/rootbound.apk > build/apk-info.txt
          cat build/apk-info.txt
          grep -F "name='com.nyxregime.rootbound'" build/apk-info.txt
          grep -F "versionName='0.9.0-m9'" build/apk-info.txt
          sha256sum build/rootbound.apk > build/rootbound.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rootbound-m9-debug-apk
          path: |
            build/rootbound.apk
            build/rootbound.apk.sha256
            build/apk-info.txt
          if-no-files-found: error
          retention-days: 14
